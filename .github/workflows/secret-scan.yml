name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guard-env-files:
    name: no committed .env or .azure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if secret-bearing files are tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|^\.azure/' \
            | grep -vE '\.env\.(example|sample)$' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::A .env or .azure file is tracked in git. Remove it and rotate anything it contained."
            exit 1
          fi
          echo "No .env or .azure files are tracked."
